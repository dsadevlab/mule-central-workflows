name: Central Mule Build and Deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: Mule application name
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: string
    secrets:
      MULE_CLIENT_ID:
        required: true
      MULE_CLIENT_SECRET:
        required: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Deploy Mule application
        run: |
          mvn -B deploy -DmuleDeploy \
            -DappName=${{ inputs.app_name }} \
            -DlogicalEnv=${{ inputs.environment }} \
            -DclientId=${{ secrets.MULE_CLIENT_ID }} \
            -DclientSecret=${{ secrets.MULE_CLIENT_SECRET }}
