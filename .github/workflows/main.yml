name: Central Mule Build and Deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: Mule application name
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: string

jobs:
  static-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          path: application

      - name: Checkout central governance framework
        uses: actions/checkout@v4
        with:
          repository: dsadevlab/mule-central-workflows
          ref: main
          path: mule-central-workflows


      # -----------------------------------
      # GitHub OIDC -> AWS STS
      # -----------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-test-role
          aws-region: ap-southeast-2

      # -----------------------------------
      # Verify assumed role
      # -----------------------------------
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # -----------------------------------
      # AWS Secrets Manager
      # -----------------------------------
      - name: Load deployment secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            ,mulesoft/dev/deployment
          parse-json-secrets: true

      # -----------------------------------
      # Test that variables exist
      # DO NOT print actual secrets
      # -----------------------------------
      - name: Verify secrets loaded
        shell: bash
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "CLIENT_ID was not loaded"
            exit 1
          fi

          if [ -z "$CLIENT_SECRET" ]; then
            echo "CLIENT_SECRET was not loaded"
            exit 1
          fi

          echo "Secrets successfully loaded from AWS Secrets Manager"


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install governance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r mule-central-workflows/requirements.txt

      - name: Run MuleSoft governance
        run: |
          python mule-central-workflows/scripts/governance_check.py \
            --root application \
            --config ../mule-central-workflows/config/governance-rules.yaml
            
  build-deploy:
    name: Build and Deploy
    needs: static-governance
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Deploy Mule application
        run: |
          mvn -B deploy -DmuleDeploy \
            -DappName=${{ inputs.app_name }} \
            -DlogicalEnv=${{ inputs.environment }}
