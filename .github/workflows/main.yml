name: Central Mule Build and Deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: Mule application name
        required: true
        type: string

      environment:
        description: Target environment
        required: true
        type: string


jobs:

  # =========================================================
  # 1. STATIC GOVERNANCE
  # =========================================================
  static-governance:
    name: Static Governance
    runs-on: ubuntu-latest

    steps:

      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          path: application

      - name: Checkout central governance framework
        uses: actions/checkout@v4
        with:
          repository: dsadevlab/mule-central-workflows
          ref: main
          path: mule-central-workflows

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install governance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r mule-central-workflows/requirements.txt

      - name: Run MuleSoft governance
        run: |
          python mule-central-workflows/scripts/governance_check.py \
            --root application \
            --config ../mule-central-workflows/config/governance-rules.yaml


  # =========================================================
  # 2. BUILD + DEPLOY
  # Runs ONLY when governance succeeds
  # =========================================================
  build-deploy:
    name: Build and Deploy
    needs: static-governance

    runs-on: ubuntu-latest

    # DEV / TEST / PROD
    environment: ${{ inputs.environment }}

    steps:

      - name: Checkout application repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Java
      # -------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # -------------------------------------------------------
      # Build
      # -------------------------------------------------------
      - name: Build
        run: |
          mvn -B clean package -DskipTests


      # -------------------------------------------------------
      # GitHub OIDC -> AWS STS -> IAM Role
      # -------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-test-role
          aws-region: ap-southeast-2
          role-session-name: github-mule-${{ inputs.environment }}


      # -------------------------------------------------------
      # Verify AWS identity
      # Temporary - useful while setting up OIDC
      # -------------------------------------------------------
      - name: Verify AWS Identity
        run: aws sts get-caller-identity


      # -------------------------------------------------------
      # AWS Secrets Manager
      # -------------------------------------------------------
      - name: Load MuleSoft deployment secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            ,mulesoft/dev/deployment
          parse-json-secrets: true


      # -------------------------------------------------------
      # Verify secrets exist - DO NOT print them
      # -------------------------------------------------------
      - name: Verify deployment secrets
        shell: bash
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "CLIENT_ID was not loaded"
            exit 1
          fi

          if [ -z "$CLIENT_SECRET" ]; then
            echo "CLIENT_SECRET was not loaded"
            exit 1
          fi

          echo "MuleSoft deployment secrets loaded successfully"


      # -------------------------------------------------------
      # Deploy
      # -------------------------------------------------------
      - name: Deploy Mule application
        run: |
          mvn -B deploy \
            -DmuleDeploy \
            -DappName="${{ inputs.app_name }}" \
            -DlogicalEnv="${{ inputs.environment }}" \
            -DclientId="$CLIENT_ID" \
            -DclientSecret="$CLIENT_SECRET"
