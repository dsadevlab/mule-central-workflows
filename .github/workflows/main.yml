name: Central Mule Build and Deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: Mule application name
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: string


    

jobs:
  static-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install governance dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt

      - name: Run MuleSoft governance
        run: |
          python scripts/governance_check.py \
            --config config/governance-rules.yaml
            
  build-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Deploy Mule application
        run: |
          mvn -B deploy -DmuleDeploy \
            -DappName=${{ inputs.app_name }} \
            -DlogicalEnv=${{ inputs.environment }}
